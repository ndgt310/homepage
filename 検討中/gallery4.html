<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- <title>Gallery</title> -->

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0d0d0d;
  color:white;
  font-family:sans-serif;
  overflow:hidden;
}

/* タイトル */
h1{
  text-align:center;
  padding:25px;
  font-size:34px;
  letter-spacing:4px;
}

/* 全体 */
.gallery-container{
  display:flex;
  flex-direction:column;
  gap:25px;
}

/* 横スクロールエリア */
.gallery-wrap{
  overflow:hidden;
  width:100%;
}

/* 横並び */
.gallery{
  display:flex;
  gap:20px;
  width:max-content;

  padding:0 20px;

  animation-name:scroll;
  animation-timing-function:linear;
  animation-iteration-count:infinite;
}

/* 逆方向 */
.reverse{
  animation-direction:reverse;
}

/* スピード */
.speed1{
  animation-duration:28s;
}

.speed2{
  animation-duration:38s;
}

.speed3{
  animation-duration:32s;
}

/* 画像 */
.gallery-item{
  flex-shrink:0;
}

.gallery img{
  width:320px;
  height:220px;

  object-fit:cover;

  border-radius:18px;

  cursor:pointer;

  transition:
    transform .3s,
    box-shadow .3s;
}

/* hover */
.gallery img:hover{
  transform:scale(1.05);

  box-shadow:
    0 10px 30px rgba(255,255,255,.18);
}

/* 無限スクロール */
@keyframes scroll{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-50%);
  }
}

/* ライトボックス */
.lightbox{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.94);

  display:none;
  justify-content:center;
  align-items:center;

  z-index:999;
}

/* 中身 */
.lightbox-content{
  max-width:90%;
  max-height:90%;

  text-align:center;
}

/* 拡大画像 */
.lightbox img{
  max-width:100%;
  max-height:75vh;

  border-radius:20px;

  animation:zoom .25s ease;
}

/* 説明文 */
.caption{
  margin-top:20px;

  font-size:20px;
  line-height:1.8;

  color:#ddd;
  white-space:pre-line; /* ←これを追加 */
}


/* 閉じる */
.close{
  position:absolute;
  top:20px;
  right:30px;

  font-size:42px;
  cursor:pointer;

  color:white;
}

/* 拡大アニメ */
@keyframes zoom{
  from{
    transform:scale(.8);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }
}

/* スマホ */
@media(max-width:768px){

  body{
    overflow:auto;
  }

  .gallery img{
    width:240px;
    height:170px;
  }

  .caption{
    font-size:16px;
  }

}
</style>
</head>

<!-- ライトボックス -->
<div class="lightbox" id="lightbox">

  <div class="close" id="closeBtn">✕</div>

  <div class="lightbox-content">

    <img id="lightboxImg" src="">

    <div class="caption" id="caption"></div>

  </div>

</div>

<script>
const images = document.querySelectorAll(".gallery img");

const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");
const caption = document.getElementById("caption");
const closeBtn = document.getElementById("closeBtn");

/* 画像クリック */
images.forEach(img => {

  img.addEventListener("click", () => {

    lightbox.style.display = "flex";

    lightboxImg.src = img.src;

    caption.textContent = img.dataset.caption;

  });

});

/* 閉じる */
closeBtn.addEventListener("click", () => {
  lightbox.style.display = "none";
});

/* 背景クリック */
lightbox.addEventListener("click", (e) => {

  if(e.target === lightbox){
    lightbox.style.display = "none";
  }

});

/* ESCキー */
document.addEventListener("keydown", (e) => {

  if(e.key === "Escape"){
    lightbox.style.display = "none";
  }

});
</script>
