<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLOATING SYSTEM</title>

<style>

/* ======================
   BASE
====================== */
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: #05070c;
  font-family: sans-serif;
}

/* ======================
   BACKGROUND FLOW
====================== */
.bg {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 30% 30%, #1a6cff, transparent 40%),
              radial-gradient(circle at 70% 70%, #ff3bd4, transparent 40%),
              radial-gradient(circle at 50% 50%, #00ffcc, transparent 50%);
  filter: blur(40px);
  animation: drift 10s infinite alternate ease-in-out;
}

@keyframes drift {
  0% { transform: scale(1) translate(0,0); }
  100% { transform: scale(1.2) translate(-50px, 30px); }
}

/* ======================
   FLOATING ORBS
====================== */
.orb {
  position: absolute;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.6);
  mix-blend-mode: screen;
  animation: float 8s infinite ease-in-out;
}

@keyframes float {
  0%   { transform: translateY(100vh) scale(0.5); opacity: 0; }
  50%  { opacity: 1; }
  100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
}

/* ======================
   CENTER CORE
====================== */
.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  text-align: center;
  color: white;
  animation: pulse 3s infinite;
}

@keyframes pulse {
  0%,100% { transform: translate(-50%,-50%) scale(1); }
  50% { transform: translate(-50%,-50%) scale(1.1); }
}

/* ======================
   INTERACTIVE GRID
====================== */
.grid {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  grid-template-rows: repeat(10, 1fr);
}

.cell {
  border: 1px solid rgba(255,255,255,0.03);
  transition: 0.3s;
}

.cell:hover {
  background: rgba(255,255,255,0.2);
  transform: scale(1.3);
}

/* ======================
   HOVER GLOBAL DISTORTION
====================== */
body:hover .bg {
  filter: blur(60px) hue-rotate(60deg);
}

/* ======================
   TEXT FLOAT
====================== */
h1 {
  font-size: 2.5rem;
  letter-spacing: 4px;
}

p {
  opacity: 0.7;
}

/* ======================
   BUTTONLESS SWITCH (CSS TRICK)
====================== */
#mode {
  display: none;
}

#mode:checked ~ .bg {
  filter: hue-rotate(180deg) contrast(1.2);
}

#mode:checked ~ .core {
  transform: translate(-50%,-50%) rotate(2deg);
}

.toggle {
  position: fixed;
  top: 10px;
  right: 10px;
  color: white;
  cursor: pointer;
  z-index: 10;
  font-size: 12px;
}

</style>
</head>

<body>

<input type="checkbox" id="mode">
<label class="toggle" for="mode">SHIFT</label>

<div class="bg"></div>

<!-- floating orbs -->
<div class="orb" style="left:10%; animation-delay:0s;"></div>
<div class="orb" style="left:25%; animation-delay:2s;"></div>
<div class="orb" style="left:40%; animation-delay:4s;"></div>
<div class="orb" style="left:60%; animation-delay:1s;"></div>
<div class="orb" style="left:80%; animation-delay:3s;"></div>

<!-- center -->
<div class="core">
  <h1>FLOAT SYSTEM</h1>
  <p>everything is moving, even when nothing is happening</p>
</div>

<!-- interactive grid -->
<div class="grid">
  <!-- 100 cells -->

  <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

  <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

</div>

</body>
