<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sample</title>

<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

<style>

/* ===== 全体 ===== */
body {
  margin: 0;
  overflow-x: hidden;
  font-family: "DotGothic16", monospace;
  background: black;
  color: white;
}



@keyframes moveBg {
  0% { transform: translate(0,0); }
  50% { transform: translate(-25%, -25%); }
  100% { transform: translate(0,0); }
}

/* ===== キラ粒 ===== */
.particle {
  position: fixed;
  width: 3px;
  height: 3px;
  background: white;
  animation: float 10s infinite;
}

@keyframes float {
  0% { transform: translateY(100vh); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}

/* ===== タイトル ===== */
h1 {
  text-align: center;
  margin-top: 100px;
  font-size: 3rem;
  letter-spacing: 5px;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 5px #0ff; }
  to { text-shadow: 0 0 20px #0ff, 0 0 40px #00f; }
}

/* ===== メニュー ===== */
.menu {
  text-align: center;
  margin: 50px 0;
}

.menu a {
  color: #0ff;
  margin: 0 20px;
  text-decoration: none;
  position: relative;
}

/* 下線アニメーション */
.menu a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -5px;
  width: 0%;
  height: 2px;
  background: #0ff;
  transition: 0.3s;
}

.menu a:hover::after {
  width: 100%;
}

/* ===== セクション ===== */
.section {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 1s;
}

/* パララックス風 */
.section:nth-child(even) {
  background: rgba(255,255,255,0.05);
}

/* ===== カード ===== */
.card {
  padding: 30px;
  border: 1px solid #0ff;
  backdrop-filter: blur(5px);
  transition: 0.5s;
}

.card:hover {
  transform: rotateY(15deg) scale(1.1);
  box-shadow: 0 0 20px #0ff;
}

/* ===== クリックで展開 ===== */
input {
  display: none;
}

.toggle-box {
  border: 1px solid #0ff;
  padding: 10px;
  cursor: pointer;
}

.content {
  max-height: 0;
  overflow: hidden;
  transition: 0.5s;
}

input:checked + .content {
  max-height: 200px;
}

/* ===== フッター ===== */
footer {
  text-align: center;
  padding: 50px;
  opacity: 0.6;
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- キラ粒 -->
<div class="particle" style="left:10%; animation-delay:0s;"></div>
<div class="particle" style="left:30%; animation-delay:2s;"></div>
<div class="particle" style="left:50%; animation-delay:4s;"></div>
<div class="particle" style="left:70%; animation-delay:1s;"></div>
<div class="particle" style="left:90%; animation-delay:3s;"></div>

<h1>このページは現在工事中です</h1>

<div class="menu">
  <a href="#about">ABOUT</a>
  <a href="#works">WORKS</a>
  <a href="#contact">CONTACT</a>
</div>

<div class="section" id="about">
  <div class="card">
    <h2>ABOUT</h2>
    <p>これはCSSだけで作られた動的ページです。</p>
  </div>
</div>

<div class="section" id="works">
  <div class="card">
    <h2>WORKS</h2>

    <!-- トグル -->
    <label class="toggle-box">
      ▶ クリックで開く
      <input type="checkbox">
      <div class="content">
        <p>JavaScriptなしでここまで動きます。</p>
      </div>
    </label>

  </div>
</div>

<div class="section" id="contact">
  <div class="card">
    <h2>CONTACT</h2>
    <p>sample@example.com</p>
  </div>
</div>
<br>
      <h1><a href="index.html"> トップページに戻る</a>　　　←避難用ボタン</h1>

<footer>
  © 2026 CSS ART
</footer>

</body>
</html>
