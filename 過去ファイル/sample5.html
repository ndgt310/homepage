<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>sample</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  background: #c0c0c0;
  font-family: "MS UI Gothic", sans-serif;
  color: #000;
}

/* ウィンドウ風コンテナ */
.window {
  max-width: 700px;
  margin: 40px auto;
  border: 2px solid #000;
  background: #e0e0e0;
  box-shadow: 4px 4px 0 #808080;
}

/* タイトルバー */
.title-bar {
  background: #000080;
  color: #fff;
  padding: 6px 10px;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* タイトルバーのボタン */
.title-btn {
  width: 16px;
  height: 16px;
  background: #c0c0c0;
  border: 2px solid #fff;
  border-right-color: #808080;
  border-bottom-color: #808080;
  cursor: pointer;
}

/* 中身 */
.content {
  padding: 20px;
}

/* ナビ */
nav a {
  margin-right: 12px;
  text-decoration: none;
  color: #000;
  font-size: 14px;
}
nav a:hover {
  text-decoration: underline;
}

/* タグ */
.tag {
  display: inline-block;
  background: #dcdcdc;
  border: 2px solid #fff;
  border-right-color: #808080;
  border-bottom-color: #808080;
  padding: 3px 8px;
  margin: 3px;
  font-size: 12px;
}

/* タイムライン */
.timeline-item {
  margin-bottom: 20px;
  padding-left: 10px;
  border-left: 2px solid #808080;
}

/* フォーム */
input, textarea {
  width: 100%;
  padding: 6px;
  border: 2px solid #fff;
  border-right-color: #808080;
  border-bottom-color: #808080;
  background: #fff;
  font-family: inherit;
}
button {
  margin-top: 10px;
  padding: 6px 20px;
  background: #dcdcdc;
  border: 2px solid #fff;
  border-right-color: #808080;
  border-bottom-color: #808080;
  cursor: pointer;
}
button:active {
  border: 2px solid #808080;
  border-right-color: #fff;
  border-bottom-color: #fff;
}
</style>
</head>

<body>

<div class="window">
  <div class="title-bar">
    <span>ポートフォリオ - Windows95風</span>
    <div class="title-btn"></div>
  </div>
  <div class="content">

    <nav>
      <a href="#about">自己紹介</a>
      <a href="#history">略歴</a>
      <a href="#contact">お問い合わせ</a>
    </nav>

    <section id="about">
      <h2>このページは現在工事中です</h2>
      <p>
        #工事中です
      </p>

      <div>
        <span class="tag">#a</span>
        <span class="tag">#b</span>
        <span class="tag">#c</span>
      </div>
    </section>

    <section id="history">
      <h2>略歴</h2>

      <div class="timeline-item">
        <strong>2010</strong><br>
        このページは現在工事中です
      </div>

      <div class="timeline-item">
        <strong>2020</strong><br>
        工事中です
      </div>
    </section>

    <section id="contact">
      <h2>お問い合わせ</h2>
      <form action="mailto:yourname@example.com" method="post" enctype="text/plain">
        <label>お名前</label>
        <input type="text" name="name" required>

        <label>メールアドレス</label>
        <input type="email" name="email" required>

        <label>メッセージ</label>
        <textarea name="message" required></textarea>

        <button type="submit">送信</button>
      </form>
    </section>
    <br>
      <h2><a href="index.html"> トップページに戻る</a>　　　←避難用ボタン</h2>

  </div>
</div>

</body>
</html>
