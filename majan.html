<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀のしゃしん</title>
    <style>
        /* 全体のスタイル設定 */
        body {
            background-color: #000000; /* 背景を黒に設定 */
            color: #ffffff;            /* 文字を白に設定 */
            font-family: "Hiragino Mincho ProN", "ヒラギノ明朝 ProN", "MS Mincho", "serif";
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;

            
        }

        /* ギャラリーのタイトル */
        h1 {
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        /* グリッドレイアウトの設定 */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            padding: 10px;
        }

        /* 各画像アイテムの枠組み */
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        /* ホバー時のズームエフェクト */
        .gallery-item:hover {
            transform: scale(1.03);
        }

        /* 画像のスタイル */
        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover; /* 画像の比率を保ったまま枠内に収める */
            display: block;
        }

        /* 画像の下に表示するテキスト（キャプション） */
        .caption {
            padding: 12px;
            background-color: #111111; /* 少し明るい黒でメリハリをつける */
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>麻雀 ページは作成途中</h1>

    <div class="gallery-container">
        <!-- 画像アイテム1 -->
        <div class="gallery-item">
            <img src="majan/m_1.jpg" alt="1">
            <div class="caption"></div>
        </div>

        <!-- 画像アイテム2 -->
        <div class="gallery-item">
            <img src="majan/m_2.jpg" alt="2">
            <div class="caption"></div>
        </div>

        <!-- 画像アイテム3 -->
        <div class="gallery-item">
            <img src="https://placeholder.com" alt="作品3">
            <div class="caption">作品タイトル 3</div>
        </div>

        <!-- 画像アイテム4 -->
        <div class="gallery-item">
            <img src="https://placeholder.com" alt="作品4">
            <div class="caption">作品タイトル 4</div>
        </div>

        <!-- 画像アイテム5 -->
        <div class="gallery-item">
            <img src="https://placeholder.com" alt="作品5">
            <div class="caption">作品タイトル 5</div>
        </div>

        <!-- 画像アイテム6 -->
        <div class="gallery-item">
            <img src="https://placeholder.com" alt="作品6">
            <div class="caption">作品タイトル 6</div>
        </div>
    </div>

</body>
</html>
